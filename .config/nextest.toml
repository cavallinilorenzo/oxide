# The `ci` profile is what CI runs (`cargo nextest run --profile ci`); the
# local runner uses the default profile, which has no timeouts or retries.

[profile.ci]
# A hung test is terminated after 5 minutes (5 periods of 60 seconds).
slow-timeout = { period = "60s", terminate-after = 5 }
# One retry, so a flaky pass is visible in the job summary instead of red.
retries = 1
# Report every failing test, not only the first.
fail-fast = false
failure-output = "immediate-final"
status-level = "retry"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"

# The Provider adapter and terminal suites spawn child processes and pseudo
# terminals. Running them with every other test at full parallelism produced
# the timeouts; a small thread budget removes the contention.
[test-groups.process-heavy]
max-threads = 2

[[profile.ci.overrides]]
filter = "(package(oxide-provider) & binary(/_adapter$|^provider_contract$/)) | test(/terminal/)"
test-group = "process-heavy"

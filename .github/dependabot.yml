# Dependabot version and security updates. Policy (what auto-merges, what
# waits for review) is in CONTRIBUTING.md and .github/workflows/dependabot-auto-merge.yml.
#
# Version updates target the default branch (`main`), weekly on Monday morning (Europe/Rome), after a
# cooldown so a compromised or broken release is usually pulled before it
# reaches us. Security updates skip the cooldown and use the same branch.
#
# Named groups take every update type, majors included, so interdependent
# packages move together. Outside them, minor and patch updates share one
# catch-all group per ecosystem and each major gets its own PR.
#
# The Rust `tauri` group and the web `tauri` group run on the same schedule; the
# `supply-chain` CI job fails if one lands without the other.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    exclude-paths:
      - "references/**"
    labels: [dependencies, rust]
    commit-message:
      prefix: chore(deps)
    groups:
      # `=`-pinned release candidates that must stay mutually compatible.
      specta:
        patterns: ["specta", "specta-*", "tauri-specta"]
      tauri:
        patterns: ["tauri", "tauri-*"]
        exclude-patterns: ["tauri-specta"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm # pnpm lockfiles use the npm ecosystem
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      lint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
      build-test:
        patterns: ["vite", "vitest", "@vitejs/*", "@vitest/*"]
      xterm:
        patterns: ["@xterm/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: chore(deps)

  # `references/` gitlinks are research snapshots: the gitsubmodule ecosystem
  # is deliberately not configured.

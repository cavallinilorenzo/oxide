# Categories for GitHub's generated release notes (used by the Release workflow).
# A PR goes into the first category whose labels it matches.
changelog:
  categories:
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Dependencies
      labels: [dependencies]
    - title: Documentation
      labels: [documentation]
    - title: Other
      labels: ["*"]

name: Advisories

# Daily RustSec advisory scan of the whole Rust dependency tree. Not a PR gate:
# a new advisory against a crate nobody touched would block unrelated PRs.
# A failure here shows up as a failed scheduled run (and as a Dependabot alert
# when GitHub's advisory database has the same entry).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

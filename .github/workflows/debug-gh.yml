name: debug-gh
on: pull_request
permissions:
  contents: read
jobs:
  debug:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo test --locked -p oxide-core --test github --test board_pull_requests --no-fail-fast -- --test-threads=4 2>&1 | grep -E "^test |panicked|DEBUG|test result" | cut -c1-400

name: Dependabot auto-merge

# Enables auto-merge (squash) on low-risk Dependabot PRs into main and labels
# the rest `manual-review`. It never merges directly: `gate` remains the only
# judge. The decision is `dependabotDecision` in tools/ci/policy.mjs.
#
# Auto-merge needs a GitHub App token (Dependabot secrets AUTOMERGE_APP_ID and
# AUTOMERGE_APP_PRIVATE_KEY): a merge made with GITHUB_TOKEN triggers no `push`
# run, so the merge commit would never get a `gate` result. Without the App the
# workflow only labels and comments, and the PR is merged by hand.

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # Gate on the PR author, not the triggering actor, so a re-run by someone
    # else on a Dependabot PR still qualifies and a human PR never does.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: policy
        name: Decide auto-merge or manual review
        run: node tools/ci/cli.mjs dependabot
        env:
          DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
      - id: app
        name: Check the App credentials
        env:
          APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
          APP_KEY: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUTOMERGE_APP_ID / AUTOMERGE_APP_PRIVATE_KEY are not set as Dependabot secrets: labelling and commenting only."
          fi
      - id: token
        name: Mint a short-lived App token
        if: steps.policy.outputs.decision == 'auto' && steps.app.outputs.present == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Enable auto-merge (squash)
        if: steps.token.outcome == 'success'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
      - name: Ask for a manual merge (no App credentials)
        if: steps.policy.outputs.decision == 'auto' && steps.app.outputs.present != 'true'
        run: |
          gh pr edit --add-label manual-review "$PR_URL"
          gh pr comment "$PR_URL" --body "Low-risk update (${REASON}). Auto-merge is off because the Dependabot secrets \`AUTOMERGE_APP_ID\` and \`AUTOMERGE_APP_PRIVATE_KEY\` are not set. Merge by hand once \`gate\` is green."
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.policy.outputs.reason }}
      - name: Label for manual review
        if: steps.policy.outputs.decision == 'manual'
        # Fails loudly when the `manual-review` label doesn't exist.
        run: |
          gh pr edit --add-label manual-review "$PR_URL"
          gh pr comment "$PR_URL" --body "Needs a human: ${REASON}."
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.policy.outputs.reason }}

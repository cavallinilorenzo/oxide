name: Release

# Builds macOS Apple Silicon bundles and Windows x64 installers.
#   - PRs into main (promotion PRs): build only, so a broken bundle blocks promotion.
#   - Manual dispatch: dry run, uploads workflow artifacts only.
#   - `vX.Y.Z` tags: version gate, build, then a draft GitHub Release with
#     signed updater packages, latest.json, checksums and provenance attestations.
#
# Signing and notarization switch on when the Apple secrets exist (see
# CONTRIBUTING.md). Without them the app is ad-hoc signed and marked unsigned.
#
# No dependency caches here: a poisoned cache must not reach release artifacts.

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    runs-on: macos-latest # Apple Silicon
    outputs:
      signed: ${{ steps.build.outputs.signed }}
      notarized: ${{ steps.build.outputs.notarized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main. Release tags are cut from main only."
            exit 1
          fi
      - name: Tag matches the declared version
        if: github.ref_type == 'tag'
        run: node .github/scripts/release-version.mjs "$GITHUB_REF_NAME"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --target aarch64-apple-darwin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm --dir web install --frozen-lockfile
      - id: build
        name: Build the app bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          # Missing secrets arrive as empty strings; Tauri treats a set-but-empty
          # APPLE_CERTIFICATE as a certificate to import, so unset them.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done

          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [ -n "${APPLE_API_PRIVATE_KEY:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
              echo "notarized=true" >> "$GITHUB_OUTPUT"
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
            else
              echo "notarized=false" >> "$GITHUB_OUTPUT"
              echo "::warning::No App Store Connect API credentials: the app is signed but not notarized."
            fi
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple signing credentials: building an unsigned (ad-hoc signed) app."
            # Apple Silicon refuses to launch a downloaded app with no signature at all.
            export APPLE_SIGNING_IDENTITY="-"
            unset APPLE_API_ISSUER APPLE_API_KEY
          fi
          unset APPLE_API_PRIVATE_KEY

          # The Tauri CLI must run from the repo root to find crates/oxide-app/tauri.conf.json.
          args=(build --ci --target aarch64-apple-darwin --bundles app,dmg)
          if [ "$RELEASE_EVENT" != "pull_request" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY before building a release."
              exit 1
            fi
            args+=(--config crates/oxide-app/tauri.updater.conf.json)
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          web/node_modules/.bin/tauri "${args[@]}"
      - name: Package artifacts and checksums
        run: |
          version=$(node -p "require('./crates/oxide-app/tauri.conf.json').version")
          bundle=target/aarch64-apple-darwin/release/bundle
          mkdir release-artifacts
          cp "$bundle"/dmg/*.dmg release-artifacts/
          if [ -f "$bundle/macos/Oxide.app.tar.gz.sig" ]; then
            cp "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig release-artifacts/
          else
            tar -czf "release-artifacts/Oxide_${version}_aarch64.app.tar.gz" -C "$bundle/macos" Oxide.app
          fi
          cd release-artifacts
          shasum -a 256 -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxide-macos-aarch64
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag is on main and matches the declared version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
          node .github/scripts/release-version.mjs "$TAG"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm --dir web install --frozen-lockfile
      - name: Build signed Windows updater package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY before building a release.' }
          & web/node_modules/.bin/tauri.cmd build --ci --bundles nsis --config crates/oxide-app/tauri.updater.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory release-artifacts | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe, target/release/bundle/nsis/*.sig release-artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxide-windows-x86_64
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [bundle, windows]
    # A tag push only: a manual run started from a tag is still a dry run.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oxide-macos-aarch64
          path: release-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oxide-windows-x86_64
          path: release-artifacts
      - name: Generate the signed updater feed and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node .github/scripts/update-manifest.mjs release-artifacts
          cd release-artifacts
          sha256sum -- *.dmg *.app.tar.gz *.exe *.sig latest.json > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.dmg
            release-artifacts/*.app.tar.gz
            release-artifacts/*.exe
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.bundle.outputs.signed }}
          NOTARIZED: ${{ needs.bundle.outputs.notarized }}
        run: |
          readme="https://github.com/$GITHUB_REPOSITORY#opening-an-unsigned-build"
          notes=""
          if [ "$SIGNED" != "true" ]; then
            notes="> [!WARNING]
          > **Unsigned build.** This release is not signed with an Apple Developer ID or notarized, so macOS Gatekeeper will block it on first launch. See [Opening an unsigned build]($readme) in the README.
          "
          elif [ "$NOTARIZED" != "true" ]; then
            notes="> [!WARNING]
          > **Not notarized.** This release is signed with an Apple Developer ID but not notarized, so macOS Gatekeeper will warn on first launch. See [Opening an unsigned build]($readme) in the README.
          "
          fi
          flags=(--draft --verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" --notes "$notes" --repo "$GITHUB_REPOSITORY" release-artifacts/*

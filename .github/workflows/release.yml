name: Release

# A Release Manager pushes a v*.*.* tag. `verify` proves the tag is releasable,
# `build` waits for a Release Manager to approve the `release` environment (that
# approval unlocks the signing secrets), and `publish` creates a DRAFT release.
# Publishing the draft stays a human click. See docs/devops.md for the runbook.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: The tag is on main or a release branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for branch in $(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "$TAG (${GITHUB_SHA}) is on ${branch#refs/remotes/}."
              exit 0
            fi
          done
          echo "::error::$TAG points at ${GITHUB_SHA}, which is not on main or a release/* branch. Tag a commit that was merged through a pull request."
          exit 1

      - name: The tag matches the declared version
        env:
          TAG: ${{ github.ref_name }}
        run: node tools/ci/cli.mjs release-version "$TAG"

      - name: The gate succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        # The rulesets don't require up-to-date branches, so two green PRs can break
        # together; the push run of CI on the exact commit is the proof.
        run: |
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=completed" --jq '.workflow_runs[].id')
          for run in $runs; do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs" --jq '.jobs[] | select(.name == "gate") | .conclusion')
            if [ "$conclusion" = "success" ]; then
              echo "gate succeeded in CI run ${run} on ${GITHUB_SHA}."
              exit 0
            fi
          done
          echo "::error::No push run of CI has a successful gate on ${GITHUB_SHA}. Wait for CI on the main run to finish (or fix it) before tagging."
          exit 1

  build:
    name: build (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        platform: [macos-aarch64, windows-x64]
    # Needs the `release` environment's secrets; build.yml declares the environment,
    # so a Release Manager must approve before the signing keys are readable.
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      release: true
    secrets: inherit

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The job holds no signing secrets, only the token that writes the draft.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oxide-*-release
          merge-multiple: true
          path: staged

      - name: Assemble the deliverables
        run: |
          mkdir release
          find staged -type f ! -name 'NOTICE-*' -exec mv {} release/ \;
          node tools/ci/cli.mjs update-manifest release "$TAG" "$GITHUB_REPOSITORY"
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq .sbom > "release/Oxide_${TAG#v}.spdx.json"
          (cd release && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt release/
          ls -l release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Draft the notes
        run: |
          node tools/ci/cli.mjs release-notes "$TAG" > notes.md
          {
            echo
            echo "### Platform signing"
            echo
            for notice in staged/NOTICE-*.txt; do echo "- $(cat "$notice")"; done
            echo
            echo "Verify any download with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\` and \`SHA256SUMS.txt\`."
          } >> notes.md

      - name: Create the draft release
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" release/* --draft --verify-tag --title "Oxide ${TAG#v}" --notes-file notes.md "${flags[@]}"

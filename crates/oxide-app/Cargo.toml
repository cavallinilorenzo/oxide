[package]
name = "oxide-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "oxide_app_lib"

[dependencies]
oxide-core = { path = "../oxide-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-updater = "2.14.1"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSProcessInfo", "NSString", "NSObject"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_UI_Shell",
] }


[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }


[package]
name = "oxide-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cpal = "0.15.3"
whisper-rs = "=0.16.0"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
dunce = "1"
base64 = "0.22.1"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
sha2 = "0.10"
tar = "0.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
crossbeam-channel = "0.5.17"
ignore = "0.4.33"
libc = "0.2.191"
notify = "8"
oxide-provider = { path = "../oxide-provider" }
portable-pty = "0.9.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "time"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"] }

[features]
dictation-vulkan = []

[dev-dependencies]
hound = "=3.5.1"


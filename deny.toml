# cargo-deny configuration. CI runs `cargo deny check bans licenses sources` in
# the `supply-chain` job and `cargo deny check advisories` daily (the
# `advisories` workflow). Run the same locally with `cargo deny check`.

[graph]
# Both shipped platforms. Crates only used on other targets stay out of the
# licence and source checks.
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# Unmaintained crates are reported for workspace dependencies only; transitive
# ones are outside our control and would fail the daily scan permanently.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  # File-level copyleft: fine to link, because we never modify MPL files of
  # crates.io dependencies.
  "MPL-2.0",
  # Public-domain style licence, needed for whisper-rs (#222).
  "Unlicense",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: keep allowances we don't use yet.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are not published; they inherit MIT from the workspace.
ignore = true

[bans]
# Tauri's tree pulls many duplicate versions; flagging them is not actionable.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Dependencies come from crates.io only. Allowing a git source or another
# registry is a deliberate decision recorded here with a comment.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

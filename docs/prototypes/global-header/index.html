<body>
<div id="viewport"><div id="stage"></div></div>
<div id="state-panel" hidden></div>
<div id="lab"><div class="switcher"><button id="previous" aria-label="Previous variant">←</button><span class="variant-name" id="variant-name"></span><button id="next" aria-label="Next variant">→</button><button data-size="1440x900">1440×900</button><button data-size="900x560">900×560</button><button id="score">Compare</button><button id="state">State</button><button id="long">Long branch</button><button id="reset">Reset</button></div><div class="lab-note">THROWAWAY · Header scope · Fixture only · ← / → variants · Ctrl+B sidebar · Ctrl+J dock · Ctrl+Shift+B Board · Esc return</div></div>
<dialog id="comparison" aria-labelledby="comparison-title"></dialog><dialog id="checkout-detail" aria-label="Checkout details"></dialog><dialog id="commit-dialog" aria-labelledby="commit-title"></dialog>
<script>
const ICONS={
 menu:'M2 3h12v2H2zm0 4h12v2H2zm0 4h12v2H2z',
 board:'M1 2h14v12H1zm1 1v10h3V3zm4 0v10h4V3zm5 0v10h3V3z',
 branch:'M5 5.6V10a2.5 2.5 0 1 1-1.5 0V5.6a2.5 2.5 0 1 1 1.5 0zM4.25 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm0 9.4a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM11.5 1a2.5 2.5 0 0 1 .75 4.88V7A3.75 3.75 0 0 1 8.5 10.75H7v-1.5h1.5A2.25 2.25 0 0 0 10.75 7V5.88A2.5 2.5 0 0 1 11.5 1zm0 1.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z',
 working:'M8 1a7 7 0 1 1-7 7h2a5 5 0 1 0 5-5z',
 needs:'M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zM7.25 4h1.5v5h-1.5zM8 12a1 1 0 1 1 0-2 1 1 0 0 1 0 2z',
 completed:'m6.2 11.3-3.5-3.5 1.1-1.1 2.4 2.4 6-6 1.1 1.1z',
 error:'M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zM5 4l3 3 3-3 1 1-3 3 3 3-1 1-3-3-3 3-1-1 3-3-3-3z',
 interrupted:'M4 3h3v10H4zm5 0h3v10H9z',
 chevron:'m5 3 5 5-5 5-1-1 4-4-4-4z',
 close:'m4 3 4 4 4-4 1 1-4 4 4 4-1 1-4-4-4 4-1-1 4-4-4-4z',
 expand:'M1 1h5v1.5H2.5V6H1zm9 0h5v5h-1.5V2.5H10zM1 10h1.5v3.5H6V15H1zm12.5 0H15v5h-5v-1.5h3.5z',
 dock:'M1 2h14v12H1zm1.5 1.5v9H9v-9zM10.5 3.5v9h3v-9z'};
const icon=n=>`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${ICONS[n]||ICONS.board}"/></svg>`;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initialThreads=()=>[
 {id:'resize',title:'Fix ConPTY resize on Windows',status:'working',board:true,slug:'conpty-resize',provider:'Claude Code',detail:'Running provider tests · 12s'},
 {id:'catalog',title:'Slash command catalog',status:'needs',board:true,slug:'slash-catalog',provider:'Codex',detail:'Approval · run cargo nextest',approval:true},
 {id:'bench',title:'Dictation Metal benchmark',status:'completed',board:false,provider:'Claude Code',detail:'Last Turn finished · 18m ago'},
 {id:'pr',title:'Pull request keyboard navigation',status:'error',board:true,slug:'pr-keyboard',provider:'Codex',detail:'Provider exited · retry needed'},
 {id:'docs',title:'Document local model setup',status:'interrupted',board:false,provider:'Claude Code',detail:'Turn stopped by you · 1h ago'},
 {id:'parser',project:'compiler',title:'Parser error recovery',status:'completed',board:false,provider:'Claude Code',detail:'Last Turn finished · 3h ago'},
 {id:'files',title:'Files Surface preview tabs',status:'completed',board:true,slug:'file-preview',provider:'Claude Code',detail:'Last Turn finished · 2h ago'}];
const names={A:'A · Global checkout toolbar',B:'B · Thread checkout toolbar',C:'C · Git lives in Diff'};
let threads=initialThreads();
const params=new URLSearchParams(location.search);
const S={variant:'ABC'.includes(params.get('variant'))&&params.get('variant')?params.get('variant'):'C',size:params.get('size')==='900x560'?'900x560':'1440x900',tid:'resize',project:'oxide',view:'thread',dock:true,tab:'Diff',side:true,max:false,groups:{needs:true,working:true,completed:true},drafts:{},scrolls:{},dockScroll:{},shell:'',code:'pub fn apply_resize(rows: u16, cols: u16) {\n    pty.resize(rows, cols)?;\n    rewrap(&mut grid, cols);\n}',file:'resize.rs',form:{title:'Improve provider reconnect',prompt:'Handle a disconnected Provider without losing the Transcript.',provider:'Codex',base:'main'},returnView:'thread',notice:''};
const small=()=>S.size==='900x560', current=()=>threads.find(t=>t.id===S.tid), branch=t=>(S.long&&t.board)?'oxide/fix-conpty-resize-and-preserve-wrapped-lines-on-windows':t.board?'oxide/'+t.slug:'main';
const projectOf=t=>t.project||'oxide';
const activeProject=()=>['board','dispatch'].includes(S.view)?S.project:projectOf(current());
const projectThreads=(p=activeProject())=>threads.filter(t=>projectOf(t)===p);
const path=t=>t.board?'~/.oxide/worktrees/'+projectOf(t)+'/'+t.slug:'C:/dev/'+projectOf(t);
const group=t=>['needs','error','interrupted'].includes(t.status)?'needs':t.status;
const grouped=(k,p=activeProject())=>projectThreads(p).filter(t=>group(t)===k);
const statusText={working:'Working',needs:'Needs input',completed:'Completed',error:'Error',interrupted:'Interrupted'};
const symbol=t=>`<span class="status-symbol status-${t.status}" title="${statusText[t.status]}">${icon(t.status)}</span>`;
function remember(){
 const draft=document.querySelector('#prompt');if(draft)S.drafts[S.tid]=draft.value;
 const transcript=document.querySelector('.transcript');if(transcript)S.scrolls[S.tid]=transcript.scrollTop;
 const pane=document.querySelector('.dock-content');if(pane)S.dockScroll[S.tab]=pane.scrollTop;
 const shell=document.querySelector('#shell');if(shell){S.shells=S.shells||{};S.shells[activeProject()]=shell.value;}
 const code=document.querySelector('#code');if(code){S.code=code.value;S.caret=code.selectionStart;S.codeScroll=code.scrollTop;}
 document.querySelectorAll('[data-form]').forEach(el=>S.form[el.dataset.form]=el.value);
}
function row(t,groupedRow=false){return `<button class="thread-row ${S.tid===t.id&&S.view==='thread'?'on':''}" data-act="thread" data-id="${t.id}" title="${escape(t.title+' · '+statusText[t.status]+' · '+branch(t))}" ${S.tid===t.id&&S.view==='thread'?'aria-current="page"':''}>${symbol(t)}<span class="row-text"><span class="row-title">${escape(t.title)}</span><span class="row-detail">${t.board?icon('branch'):''} ${groupedRow?escape(branch(t)):statusText[t.status]+(t.board?' · worktree':' · main checkout')}</span></span></button>`;}
function projectBoardButton(p){return `<button class="ghost project-board ${S.view==='board'&&S.project===p?'on':''}" data-act="board" data-project="${p}" aria-label="Open Thread Board for ${p}" aria-pressed="${S.view==='board'&&S.project===p}" title="Thread Board · ${p}">${icon('board')}</button>`;}
function sidebar(){return `<nav class="sidebar" aria-label="Projects and Threads"><button class="primary entry" data-act="new">+ New Thread</button>${['oxide','compiler'].map(p=>`<div class="project">${icon('chevron')} <span class="truncate">${p}</span><span class="sp"></span><span class="badge">${projectThreads(p).length}</span>${projectBoardButton(p)}</div>${projectThreads(p).map(t=>row(t)).join('')}`).join('')}<span class="sp"></span><div class="small dim" style="padding:18px 8px 4px">Recent Threads · Board beside each Project</div></nav>`;}
const gitFixture={};
const gitState=()=>gitFixture[path(current())]||(gitFixture[path(current())]={files:3,add:24,del:8,pushed:false});
const needsThreads=()=>threads.filter(t=>group(t)==='needs');
function gitControls(home){const g=gitState();return `<div class="git-controls" aria-label="${home} Git actions for ${escape(branch(current()))}"><button data-act="git" title="Review uncommitted changes in ${escape(path(current()))}">${g.files} files <span class="status-completed">+${g.add}</span> <span class="status-error">−${g.del}</span></button><button data-act="commit" ${g.files?'':'disabled'}>Commit &amp; Push</button></div>`;}
function checkoutControl(){return `<button class="checkout-button truncate" data-act="checkout" title="Checkout: ${escape(path(current()))}">${icon('branch')} <span class="truncate">${escape(branch(current()))}</span></button>`;}
function header(){return `<header><button class="ghost" data-act="side" aria-label="Toggle sidebar (Ctrl+B)" title="Sidebar · Ctrl+B">${icon('menu')}</button><label class="project-picker"><span class="sr-only">Project</span><select id="project-select" aria-label="Project">${['oxide','compiler'].map(p=>`<option ${p===activeProject()?'selected':''}>${p}</option>`).join('')}</select></label>${S.variant==='A'&&S.view==='thread'?`${checkoutControl()}${gitControls('Global header')}`:''}<span class="sp"></span><button class="status-chip needs" data-act="attention" aria-label="${needsThreads().length} Threads need input across open Projects" title="Open pending Approval across open Projects">${icon('needs')} ${needsThreads().length} need input</button><button class="${S.dock&&S.view==='thread'?'on':''}" data-act="dock" title="Surfaces dock · Ctrl+J" aria-label="Toggle Surfaces dock (Ctrl+J)">${icon('dock')}</button></header>`;}
function threadGit(){return S.variant==='B'?`<div class="thread-git">${checkoutControl()}<span class="sp"></span>${gitControls('Thread toolbar')}</div>`:'';}

function dispatch(){const slug=S.form.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'new-thread';return `<section class="centre"><form class="dispatch" id="dispatch-form"><h1>Dispatch Board Thread</h1><p class="dim">Start a Thread in its own worktree for ${escape(activeProject())}.</p><label>Thread title<input data-form="title" required value="${escape(S.form.title)}"></label><label>First prompt<textarea data-form="prompt" required>${escape(S.form.prompt)}</textarea></label><div class="two"><label>Provider<select data-form="provider">${['Codex','Claude Code','Antigravity'].map(p=>`<option ${S.form.provider===p?'selected':''}>${p}</option>`).join('')}</select></label><label>Base branch<select data-form="base">${['main','release/0.1'].map(b=>`<option ${S.form.base===b?'selected':''}>${b}</option>`).join('')}</select></label></div><div class="checkout-preview"><b>Own worktree</b><div id="checkout-path" class="mono">~/.oxide/worktrees/${escape(activeProject())}/${escape(slug)}</div><div class="small dim">New branch <code id="checkout-branch">oxide/${escape(slug)}</code> from local commits on the selected base branch. Uncommitted changes stay in the main checkout.</div></div><div class="buttons"><button class="primary" type="submit">Dispatch Board Thread</button><button type="button" data-act="cancel">Cancel</button></div><p class="small dim">Fixture: dispatch creates an in-memory Board Thread. No files, branch or Provider process are created.</p></form></section>`;}

document.querySelector('#comparison').innerHTML=`<div class="flex"><h1 id="comparison-title">What stays global?</h1><span class="sp"></span><button id="close-comparison" aria-label="Close comparison">${icon('close')}</button></div><p>Three header variants on the settled skeleton B. Board icons stay beside Project names in every variant. These are design judgements against the eight principles, not user testing.</p><table><thead><tr><th>Principle</th><th>A · Global checkout</th><th>B · Thread checkout</th><th>C · Git in Diff</th></tr></thead><tbody>${scoreRows.map(r=>`<tr>${r.map((cell,i)=>i?`<td>${cell}</td>`:`<th>${cell}</th>`).join('')}</tr>`).join('')}</tbody></table><h2>Recommendation: C · Git lives in Diff</h2><p>Global: Project navigation, needs-input across open Projects, sidebar/dock handles. Thread: title, status and read-only checkout identity. Diff: checkout details, changed-file/line counts, Commit &amp; Push. The action stays beside a clearly scoped review of all uncommitted changes, regardless of the Turn or Branch Diff being read.</p><p>Cost: committing requires opening Diff. The Diff tab shows the changed-file count; a maximized Terminal keeps its own checkout label and the global needs-input chip. The Board has no implicit Git target. B is the faster alternative if immediate commit access outweighs keeping review and action together.</p><p>At 900×560, sidebar yields to the 482px dock; the Thread keeps 416px. Branch names truncate before actions or needs-input. A maximized Surface hides Thread content but preserves header status and a restore handle. No Work-mode or Board header toggle returns.</p><p>Try: switch to a Board Thread; inspect the Git target; open Terminal (its checkout does not follow); maximize; jump to a pending Approval; open the Project Board; switch Projects; enable Long branch. Draft/code/shell inputs are memory-only fixtures.</p>`;
document.querySelector('#score').onclick=()=>document.querySelector('#comparison').showModal();document.querySelector('#close-comparison').onclick=()=>document.querySelector('#comparison').close();
if(params.get('capture')==='1'){document.querySelector('#viewport').style.inset='0';document.querySelector('#lab').style.display='none';}
render();
</script>

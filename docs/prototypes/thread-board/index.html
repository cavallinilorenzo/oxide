.board{flex:1;min-height:0;overflow:auto;padding:22px}.board-heading{display:flex;align-items:flex-start;gap:12px;margin-bottom:22px}.board-heading p{margin-top:5px;color:var(--dim)}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.column-heading{display:flex;align-items:center;gap:7px;margin-bottom:12px;font-size:12px;font-weight:600}.thread-card{width:100%;padding:13px;display:block;text-align:left;background:var(--bg2);border:1px solid var(--line);margin-bottom:10px;border-radius:8px}.thread-card .card-title{font-weight:600;font-size:13px;line-height:1.5;display:block;margin-bottom:9px}.thread-card .card-status{font-size:11px;display:flex;gap:6px;align-items:center;margin-bottom:10px}.checkout{border-top:1px solid var(--line);padding-top:9px;display:block;font-size:11px;color:var(--dim);overflow-wrap:anywhere}.checkout b{color:var(--fg);font-weight:400;display:block;margin:2px 0}.checkout .path{font:10px/1.4 var(--mono);display:block;color:var(--dim)}.board-footer{margin-top:20px;font-size:12px;color:var(--dim)}.section-list{margin-top:10px}.recent-item{width:100%;justify-content:flex-start;margin-top:8px;padding:12px;text-align:left;background:var(--bg2)}

x;flex:none;border-top:1px solid var(--line);padding:3px 12px;color:var(--dim);font-size:11px;display:flex;gap:12px;align-items:center;overflow:hidden;white-space:nowrap}.compact .sidebar{width:220px}.compact .dock{width:482px}.compact .board{padding:16px}.compact .columns{gap:10px}.compact .thread-card{padding:10px}.compact .path{display:none}.compact .board-heading{margin-bottom:14px}.compact header{padding:0 8px;gap:5px}.compact header .location{max-width:120px}.compact header .branch{max-width:135px}.compact .transcript{padding:16px}.compact .composer{padding:9px 14px}.compact .dock-content{padding:12px}.compact .dock-tabs{padding:5px 3px;gap:0}.compact .dock-tabs button{font-size:11px;padding:4px 5px}.compact .board-footer{margin-top:12px}.compact .thread-head{padding:8px 14px}.compact .thread-card .card-title{font-size:12px}.compact .statusbar .extra{display:none}

<div id="viewport"><div id="stage"></div></div>

<div id="lab"><div class="switcher"><button id="previous" aria-label="Previous variant">←</button><span class="variant-name" id="variant-name"></span><button id="next" aria-label="Next variant">→</button><button data-size="1440x900">1440×900</button><button data-size="900x560">900×560</button><button id="score">Compare</button><button id="state">State</button><button id="reset">Reset</button></div><div class="lab-note">THROWAWAY · Fixture only · ← / → variants · Ctrl+B sidebar · Ctrl+J dock · Ctrl+Shift+B Board · Esc return</div></div>

<script>
const ICONS={
 menu:'M2 3h12v2H2zm0 4h12v2H2zm0 4h12v2H2z',
 board:'M1 2h14v12H1zm1 1v10h3V3zm4 0v10h4V3zm5 0v10h3V3z',
 branch:'M5 5.6V10a2.5 2.5 0 1 1-1.5 0V5.6a2.5 2.5 0 1 1 1.5 0zM4.25 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm0 9.4a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM11.5 1a2.5 2.5 0 0 1 .75 4.88V7A3.75 3.75 0 0 1 8.5 10.75H7v-1.5h1.5A2.25 2.25 0 0 0 10.75 7V5.88A2.5 2.5 0 0 1 11.5 1zm0 1.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z',
 working:'M8 1a7 7 0 1 1-7 7h2a5 5 0 1 0 5-5z',
 needs:'M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zM7.25 4h1.5v5h-1.5zM8 12a1 1 0 1 1 0-2 1 1 0 0 1 0 2z',
 completed:'m6.2 11.3-3.5-3.5 1.1-1.1 2.4 2.4 6-6 1.1 1.1z',
 error:'M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zM5 4l3 3 3-3 1 1-3 3 3 3-1 1-3-3-3 3-1-1 3-3-3-3z',
 interrupted:'M4 3h3v10H4zm5 0h3v10H9z',
 chevron:'m5 3 5 5-5 5-1-1 4-4-4-4z',
 close:'m4 3 4 4 4-4 1 1-4 4 4 4-1 1-4-4-4 4-1-1 4-4-4-4z',
 expand:'M1 1h5v1.5H2.5V6H1zm9 0h5v5h-1.5V2.5H10zM1 10h1.5v3.5H6V15H1zm12.5 0H15v5h-5v-1.5h3.5z',
 dock:'M1 2h14v12H1zm1.5 1.5v9H9v-9zM10.5 3.5v9h3v-9z'};
const icon=n=>`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${ICONS[n]||ICONS.board}"/></svg>`;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initialThreads=()=>[
 {id:'resize',title:'Fix ConPTY resize on Windows',status:'working',board:true,slug:'conpty-resize',provider:'Claude Code',detail:'Running provider tests · 12s'},
 {id:'catalog',title:'Slash command catalog',status:'needs',board:true,slug:'slash-catalog',provider:'Codex',detail:'Approval · run cargo nextest',approval:true},
 {id:'bench',title:'Dictation Metal benchmark',status:'completed',board:false,provider:'Claude Code',detail:'Last Turn finished · 18m ago'},
 {id:'pr',title:'Pull request keyboard navigation',status:'error',board:true,slug:'pr-keyboard',provider:'Codex',detail:'Provider exited · retry needed'},
 {id:'docs',title:'Document local model setup',status:'interrupted',board:false,provider:'Claude Code',detail:'Turn stopped by you · 1h ago'},
 {id:'files',title:'Files Surface preview tabs',status:'completed',board:true,slug:'file-preview',provider:'Claude Code',detail:'Last Turn finished · 2h ago'}];
const names={A:'A · Header Board toggle',B:'B · Project overview',C:'C · Board in sidebar'};
let threads=initialThreads();
const params=new URLSearchParams(location.search);
const S={variant:'ABC'.includes(params.get('variant'))&&params.get('variant')?params.get('variant'):'A',size:params.get('size')==='900x560'?'900x560':'1440x900',tid:'resize',view:'thread',dock:true,tab:'Diff',side:true,max:false,groups:{needs:true,working:true,completed:true},drafts:{},scrolls:{},dockScroll:{},shell:'',code:'pub fn apply_resize(rows: u16, cols: u16) {\n    pty.resize(rows, cols)?;\n    rewrap(&mut grid, cols);\n}',file:'resize.rs',form:{title:'Improve provider reconnect',prompt:'Handle a disconnected Provider without losing the Transcript.',provider:'Codex',base:'main'},returnView:'thread',notice:''};
const small=()=>S.size==='900x560', current=()=>threads.find(t=>t.id===S.tid), branch=t=>t.board?'oxide/'+t.slug:'main';
const path=t=>t.board?'~/.oxide/worktrees/oxide/'+t.slug:'C:/dev/oxide';
const group=t=>['needs','error','interrupted'].includes(t.status)?'needs':t.status;
const grouped=k=>threads.filter(t=>group(t)===k);
const statusText={working:'Working',needs:'Needs input',completed:'Completed',error:'Error',interrupted:'Interrupted'};
const symbol=t=>`<span class="status-symbol status-${t.status}" title="${statusText[t.status]}">${icon(t.status)}</span>`;
function remember(){
 const draft=document.querySelector('#prompt');if(draft)S.drafts[S.tid]=draft.value;
 const transcript=document.querySelector('.transcript');if(transcript)S.scrolls[S.tid]=transcript.scrollTop;
 const pane=document.querySelector('.dock-content');if(pane)S.dockScroll[S.tab]=pane.scrollTop;
 const shell=document.querySelector('#shell');if(shell)S.shell=shell.value;
 const code=document.querySelector('#code');if(code){S.code=code.value;S.caret=code.selectionStart;S.codeScroll=code.scrollTop;}
 document.querySelectorAll('[data-form]').forEach(el=>S.form[el.dataset.form]=el.value);
}
function row(t,groupedRow=false){return `<button class="thread-row ${S.tid===t.id&&S.view==='thread'?'on':''}" data-act="thread" data-id="${t.id}" title="${escape(t.title+' · '+statusText[t.status]+' · '+branch(t))}" ${S.tid===t.id&&S.view==='thread'?'aria-current="page"':''}>${symbol(t)}<span class="row-text"><span class="row-title">${escape(t.title)}</span><span class="row-detail">${t.board?icon('branch'):''} ${groupedRow?escape(branch(t)):statusText[t.status]+(t.board?' · worktree':' · main checkout')}</span></span></button>`;}
function sidebar(){return `<nav class="sidebar" aria-label="Projects and Threads"><button class="primary entry" data-act="new">+ New Thread</button><div class="project">${icon('chevron')} oxide <span class="sp"></span><span class="badge">${threads.length}</span></div>
 ${S.variant==='B'?`<button class="entry ${S.view==='board'?'on':''}" data-act="board">${icon('board')} Thread Board <span class="sp"></span><span class="badge" title="Threads needing input">${grouped('needs').length}</span></button>`:''}
 ${S.variant==='C'?`<button class="entry" data-act="dispatch">${icon('branch')} Dispatch Board Thread</button>${['needs','working','completed'].map(k=>`<button class="group-toggle" data-act="group" data-id="${k}" aria-expanded="${S.groups[k]}">${icon('chevron')} ${{needs:'Needs input',working:'Working',completed:'Completed'}[k]} <span class="sp"></span>${grouped(k).length}</button>${S.groups[k]?grouped(k).map(t=>row(t,true)).join(''):''}`).join('')}`:threads.map(t=>row(t)).join('')}
 <div class="project" style="margin-top:14px">${icon('chevron')} compiler</div><button class="thread-row" data-act="compiler">${symbol({status:'completed'})}<span class="row-text"><span class="row-title">Parser error recovery</span><span class="row-detail">Completed · main checkout</span></span></button><span class="sp"></span><div class="small dim" style="padding:18px 8px 4px">${S.variant==='A'?'Threads in recent order · Board in header':S.variant==='B'?'Threads in recent order · Board per Project':'All Threads grouped by Thread status'}</div></nav>`;}
function header(){const t=current();return `<header><button class="ghost" data-act="side" aria-label="Toggle sidebar (Ctrl+B)" title="Sidebar · Ctrl+B">${icon('menu')}</button><b>oxide</b><span class="location truncate dim">${S.view==='board'?'Thread Board':S.view==='dispatch'?'Dispatch Board Thread':escape(t.title)}</span>${S.view==='thread'?`<span class="branch truncate dim small">${icon('branch')} ${escape(branch(t))}</span>`:''}<div class="ambient" aria-label="Thread status summary">${['needs','working','completed'].map(k=>`<button class="status-chip ${k}" data-act="status" data-id="${k}" title="${k==='needs'?'Open a pending Approval or first Thread needing input':'Open first '+k+' Thread'}">${icon(k)} ${grouped(k).length} ${{needs:'need input',working:'working',completed:'done'}[k]}</button>`).join('')}</div>${S.variant==='A'?`<button class="${S.view==='board'?'on':''}" data-act="board" aria-pressed="${S.view==='board'}" title="Thread Board · Ctrl+Shift+B">${icon('board')} Board</button>`:''}<button class="${S.dock?'on':''}" data-act="dock" title="Surfaces dock · Ctrl+J" aria-label="Toggle Surfaces dock (Ctrl+J)">${icon('dock')}</button></header>`;}
function board(){return `<section class="centre"><div class="board"><div class="board-heading"><div><h1>${S.variant==='B'?'oxide · Thread Board':'Thread Board'}</h1><p>All Threads in this Project, grouped by Thread status.</p></div><span class="sp"></span><button class="primary" data-act="dispatch">${icon('branch')} Dispatch Board Thread</button><button class="ghost" data-act="return" title="Return to selected Thread" aria-label="Return to selected Thread">${icon('close')}</button></div><div class="columns">${['needs','working','completed'].map(k=>`<section><h2 class="column-heading">${icon(k)} ${{needs:'Needs input',working:'Working',completed:'Completed'}[k]} <span class="badge">${grouped(k).length}</span></h2>${grouped(k).map(t=>`<button class="thread-card" data-act="thread" data-id="${t.id}"><span class="card-title">${escape(t.title)}</span><span class="card-status status-${t.status}">${icon(t.status)} ${escape(t.detail)}</span><span class="dim small">${escape(t.provider)}</span><span class="checkout">${t.board?'Board Thread · own worktree':'Thread · main checkout'}<b>${icon('branch')} ${escape(branch(t))}</b><span class="path">${escape(path(t))}</span></span></button>`).join('')}</section>`).join('')}</div><p class="board-footer">Error and interrupted Threads appear in Needs input. Select a Thread to read its Transcript or answer its Approval.</p></div></section>`;}
function transcript(){const t=current();return `<section class="centre"><div class="thread-head"><div class="flex"><h2 class="truncate">${escape(t.title)}</h2><span class="flex small status-${t.status}">${icon(t.status)} ${statusText[t.status]}</span></div><div class="small dim truncate" title="${escape(path(t))}">${t.board?'Board Thread · own worktree':'Thread · main checkout'} · ${escape(branch(t))} · ${escape(t.provider)}</div></div><div class="transcript"><div class="message user">${escape(t.prompt||({resize:'Terminal shrinks and wrapped lines duplicate when the window is resized. Fix it.',catalog:'Wire the Codex Slash command catalog and run the Provider tests.',pr:'Make Pull request controls accessible from the keyboard.',docs:'Document setup for the local speech model.'}[t.id]||'Check the changes and explain the result.'))}</div><div class="message"><div class="activity">Explored 4 files · Edited 2 files · Ran 2 commands</div><p>${t.id==='resize'?'I traced the duplicate lines to the order of the PTY resize and rewrap. The new width is now applied before wrapped rows are counted. I’m running the regression tests.':t.approval?'The catalog now routes the Provider commands correctly. I need approval to run the test suite in this Board Thread’s worktree.':t.status==='error'?'The Provider exited before the Turn finished. Your Transcript and worktree are still available.':t.status==='interrupted'?'The Turn was stopped. You can send another prompt to continue.':t.status==='working'?'The Turn is working in this Thread’s checkout. Your other Threads continue independently.':'The last Turn finished. The changes are ready to inspect in Diff.'}</p>${t.approval?`<section class="approval" aria-label="Pending Approval"><h3>Approval needed · run a command</h3><pre>cargo nextest run -p oxide-provider</pre><p class="small dim">Target: ${escape(path(t))}</p><div class="buttons"><button class="primary" data-act="allow">Allow once</button><button data-act="deny">Deny</button></div></section>`:''}<div class="activity">${icon(t.status)} ${escape(t.detail)}</div>${t.status==='working'?'<p class="small dim">This is a simulated working Turn. Use “Background Approval” in State to signal a change without moving your focus.</p>':''}</div></div><div class="composer"><textarea id="prompt" aria-label="Prompt to ${escape(t.provider)}" placeholder="Reply to ${escape(t.provider)}…">${escape(S.drafts[t.id]||'')}</textarea><div class="flex"><span class="hint">${escape(t.provider)} · Model default · High</span><span class="sp"></span><span class="hint">Provider prompt</span><button class="primary" data-act="send">Send</button></div></div></section>`;}
function dispatch(){const slug=S.form.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'new-thread';return `<section class="centre"><form class="dispatch" id="dispatch-form"><h1>Dispatch Board Thread</h1><p class="dim">Start a Thread in its own worktree for oxide.</p><label>Thread title<input data-form="title" required value="${escape(S.form.title)}"></label><label>First prompt<textarea data-form="prompt" required>${escape(S.form.prompt)}</textarea></label><div class="two"><label>Provider<select data-form="provider">${['Codex','Claude Code','Antigravity'].map(p=>`<option ${S.form.provider===p?'selected':''}>${p}</option>`).join('')}</select></label><label>Base branch<select data-form="base">${['main','release/0.1'].map(b=>`<option ${S.form.base===b?'selected':''}>${b}</option>`).join('')}</select></label></div><div class="checkout-preview"><b>Own worktree</b><div id="checkout-path" class="mono">~/.oxide/worktrees/oxide/${escape(slug)}</div><div class="small dim">New branch <code id="checkout-branch">oxide/${escape(slug)}</code> from local commits on the selected base branch. Uncommitted changes stay in the main checkout.</div></div><div class="buttons"><button class="primary" type="submit">Dispatch Board Thread</button><button type="button" data-act="cancel">Cancel</button></div><p class="small dim">Fixture: dispatch creates an in-memory Board Thread. No files, branch or Provider process are created.</p></form></section>`;}
function dock(){const t=current();let body='';
 if(S.tab==='Diff')body=`<div class="flex"><b>${t.board?'Branch':'Turn'} Diff</b><span class="sp"></span><button data-act="open-file">Open in Code</button></div><p class="small dim" style="margin-top:8px">crates/oxide-pty/src/resize.rs · +3 −2</p><div class="hunk"><div class="line">@@ -41,4 +41,5 @@ apply_resize</div><div class="del">- rewrap(&amp;mut grid, cols);</div><div class="del">- pty.resize(rows, cols)?;</div><div class="add">+ pty.resize(rows, cols)?;</div><div class="add">+ // apply new width before rewrapping</div><div class="add">+ rewrap(&amp;mut grid, cols);</div></div><p class="small dim">Illustrative hunk · checkout follows the selected Thread.</p>`;
 if(S.tab==='Terminal')body=`<div class="flex"><b>Project terminal tabs</b><span class="badge">resize · main</span></div><p class="small dim">Tab opened from “Fix ConPTY resize”. Its checkout stays fixed when you select another Thread.</p><div class="terminal-block"><div class="command mono">&gt; cargo nextest run -p oxide-pty</div><pre>PASS resize::shrinks_cols\nPASS resize::reflows_wrapped_lines\n14 tests passed · exit 0</pre></div>${t.id!=='resize'?'<p class="status-needs small">This tab is in a different checkout from the selected Thread.</p>':''}<label class="small dim" for="shell">Shell command · oxide/conpty-resize</label><input id="shell" value="${escape(S.shell)}" placeholder="Enter a shell command…"><p class="small dim" style="margin-top:10px">Fixture input · commands do not execute.</p>`;
 if(S.tab==='Files')body=`<div class="flex"><button class="on">resize.rs</button><button data-act="diff">← Diff</button></div><div class="files-split"><div class="file-tree small"><b>Files</b><span class="dim">crates / oxide-pty</span><button class="on" data-act="file">resize.rs</button><span class="dim">tests / resize.rs</span></div><textarea id="code" class="code-editor" spellcheck="false" aria-label="resize.rs editor">${escape(S.code)}</textarea></div><p class="small dim">Open files stay inside Files. Illustrative editor, edits held in memory.</p>`;
 if(S.tab==='Pull request')body='<h2>ConPTY resize order</h2><p class="dim">Illustrative Pull request · oxide/conpty-resize → main</p><p style="margin-top:16px">Checks passed. The resize now applies the PTY width before rewrapping the grid.</p>';
 if(S.tab==='Issues')body='<h2>Project issues</h2><p style="margin-top:16px">Terminal reflows wrapped lines twice</p><p class="dim small">Illustrative issue · opened from oxide</p>';
 return `<aside class="dock" aria-label="Surfaces dock"><nav class="dock-tabs" aria-label="Surface tabs">${['Diff','Files','Terminal','Pull request','Issues'].map(k=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-id="${k}" aria-pressed="${S.tab===k}">${k}</button>`).join('')}<span class="sp"></span><button data-act="maximize" title="Maximize or restore Surface" aria-label="Maximize or restore Surface">${icon('expand')}</button></nav><div class="dock-content"><div class="scope">${S.tab==='Terminal'?'Project oxide · tab checkout: ~/.oxide/worktrees/oxide/conpty-resize':escape(branch(t)+' · '+path(t))}</div>${body}</div></aside>`;
}
function rail(){return `<nav class="rail" aria-label="Collapsed Thread navigation"><button data-act="return" title="Restore Thread" aria-label="Restore Thread">${icon('chevron')}</button>${threads.map(t=>`<button data-act="thread" data-id="${t.id}" title="${escape(t.title+' · '+statusText[t.status])}" aria-label="${escape(t.title+' · '+statusText[t.status])}">${symbol(t)}</button>`).join('')}</nav>`;}
function render(){
 const [w,h]=S.size.split('x').map(Number),stage=document.querySelector('#stage');
 stage.style.width=w+'px';stage.style.height=h+'px';const scale=Math.min(1,(innerWidth-12)/w,(innerHeight-94)/h);stage.style.transform=`scale(${scale})`;
 const isBoard=S.view==='board'&&S.variant!=='C',max=S.max&&S.view==='thread'&&S.dock;
 stage.className=(small()?'compact ':'')+(max?'maximized':'');
 const showDock=S.dock&&S.view==='thread', showSide=S.side&&!max&&!(small()&&showDock);
 stage.innerHTML=header()+`<main>${showSide?sidebar():max?rail():''}${max?'':S.view==='dispatch'?dispatch():isBoard?board():transcript()}${showDock?dock():''}</main><footer class="statusbar"><span>${icon(current().board?'branch':'completed')} ${escape(branch(current()))}</span><span class="truncate">${escape(S.notice|| (S.view==='board'?'Thread Board · oxide':path(current())))}</span><span class="sp"></span><span class="extra">${small()?'Sidebar and dock are exclusive':'Thread + Surfaces dock'} · ${S.size.replace('x','×')}</span></footer>`;
 const transcriptEl=document.querySelector('.transcript');if(transcriptEl)transcriptEl.scrollTop=S.scrolls[S.tid]||0;
 const pane=document.querySelector('.dock-content');if(pane)pane.scrollTop=S.dockScroll[S.tab]||0;
 const code=document.querySelector('#code');if(code){code.setSelectionRange(S.caret||0,S.caret||0);code.scrollTop=S.codeScroll||0;}
 document.querySelector('#variant-name').textContent=names[S.variant];document.querySelectorAll('[data-size]').forEach(el=>el.classList.toggle('on',el.dataset.size===S.size));
 history.replaceState(null,'','?variant='+S.variant+'&size='+S.size);renderState();
}
function renderState(){document.querySelector('#state-panel').innerHTML=`<h2>Prototype state · ${names[S.variant]}</h2><pre>${escape(JSON.stringify({view:S.view,selectedThread:current().title,selectedCheckout:path(current()),counts:{needsInput:grouped('needs').length,working:grouped('working').length,completed:grouped('completed').length},dock:{open:S.dock,tab:S.tab,maximized:S.max},sidebarRequested:S.side,terminalCheckout:'~/.oxide/worktrees/oxide/conpty-resize',drafts:S.drafts,dispatch:S.form},null,2))}</pre><button id="background">Background Approval</button><p class="small dim">While typing, Ctrl+Shift+I simulates a new Approval in another Thread. Only status indicators change; focus stays put.</p>`;}
function selectThread(id){S.tid=id;S.view='thread';S.max=false;S.notice='';}
function toggleDock(){if(S.view!=='thread'){S.view='thread';S.dock=true;}else S.dock=!S.dock;S.max=false;}
function toggleSide(){if((small()&&S.dock)||S.max){S.side=true;S.dock=false;S.max=false;}else S.side=!S.side;}
function toggleBoard(){if(S.variant==='C'){S.side=true;S.dock=false;S.max=false;S.view='thread';}else S.view=S.view==='board'?'thread':'board';}
function navigateVariant(delta){remember();S.variant='ABC'[('ABC'.indexOf(S.variant)+delta+3)%3];if(S.variant==='C'&&S.view==='board')S.view='thread';render();}
function backgroundApproval(){const active=document.activeElement;const focusAction=active?.dataset?.act;const focusId=active?.dataset?.id;const t=threads.find(t=>t.id!==S.tid&&t.status==='working')||threads.find(t=>t.id!==S.tid);t.status='needs';t.approval=true;t.detail='Approval · run cargo nextest';S.notice='New Approval in '+t.title;document.querySelector('header').outerHTML=header();const side=document.querySelector('.sidebar');if(side)side.outerHTML=sidebar();document.querySelector('.statusbar .truncate').textContent=S.notice;if(S.view==='board'&&S.variant!=='C'){const priorScroll=document.querySelector('.board')?.scrollTop||0;document.querySelector('.centre').outerHTML=board();document.querySelector('.board').scrollTop=priorScroll;}if(!active.isConnected&&focusAction){const next=[...document.querySelectorAll('[data-act]')].find(el=>el.dataset.act===focusAction&&el.dataset.id===focusId);next?.focus();}renderState();}
document.addEventListener('input',e=>{if(e.target.dataset.form){S.form[e.target.dataset.form]=e.target.value;const slug=S.form.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'new-thread';document.querySelector('#checkout-path').textContent='~/.oxide/worktrees/oxide/'+slug;document.querySelector('#checkout-branch').textContent='oxide/'+slug;}if(e.target.id==='prompt')S.drafts[S.tid]=e.target.value;renderState();});
document.addEventListener('click',e=>{if(e.target.closest('#background')){backgroundApproval();return;}const el=e.target.closest('[data-act]');if(!el)return;remember();const a=el.dataset.act,id=el.dataset.id;
 if(a==='thread')selectThread(id);
 if(a==='status'){const list=grouped(id);if(list.length)selectThread((list.find(t=>t.approval)||list[0]).id);}
 if(a==='board')toggleBoard();
 if(a==='return'){S.view='thread';S.max=false;}
 if(a==='side')toggleSide();
 if(a==='dock')toggleDock();
 if(a==='tab')S.tab=id;
 if(a==='maximize')S.max=!S.max;
 if(a==='open-file'){S.tab='Files';S.dock=true;}
 if(a==='diff')S.tab='Diff';
 if(a==='file')S.file='resize.rs';
 if(a==='group')S.groups[id]=!S.groups[id];
 if(a==='dispatch'){S.returnView=S.view;S.view='dispatch';S.max=false;}
 if(a==='cancel')S.view=S.returnView;
 if(a==='allow'||a==='deny'){const t=current();t.approval=false;t.status=a==='allow'?'working':'interrupted';t.detail=a==='allow'?'Running cargo nextest · just now':'Approval denied · Turn stopped';}
 if(a==='send'){const t=current(),prompt=S.drafts[t.id];if(prompt&&prompt.trim()){t.prompt=prompt;t.status='working';t.approval=false;t.detail='Working on your prompt · just now';S.drafts[t.id]='';}else S.notice='Type a prompt to start a Turn.';}
 if(a==='new'){const id='thread-'+Date.now();threads.unshift({id,title:'New Thread',status:'completed',board:false,provider:'Codex',detail:'Ready for your first prompt'});selectThread(id);}
 if(a==='compiler')S.notice='Compiler is illustrative; this comparison focuses on Project oxide.';
 render();if(a==='status')document.querySelector('.approval button')?.focus();
});
document.addEventListener('submit',e=>{if(e.target.id!=='dispatch-form')return;e.preventDefault();remember();const id='board-'+Date.now(),title=S.form.title.trim();let slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'new-thread';const baseSlug=slug;let n=2;while(threads.some(t=>t.slug===slug))slug=baseSlug+'-'+n++;threads.unshift({id,title,status:'working',board:true,slug,provider:S.form.provider,prompt:S.form.prompt,base:S.form.base,detail:'Starting first Turn · just now'});selectThread(id);S.notice='Dispatched '+title+' · base '+S.form.base+' · own worktree';render();});
document.querySelector('#previous').onclick=()=>navigateVariant(-1);document.querySelector('#next').onclick=()=>navigateVariant(1);
document.querySelectorAll('[data-size]').forEach(el=>el.onclick=()=>{remember();S.size=el.dataset.size;render();});
document.querySelector('#state').onclick=()=>{remember();renderState();document.querySelector('#state-panel').hidden=!document.querySelector('#state-panel').hidden;};
document.querySelector('#reset').onclick=()=>location.reload();
addEventListener('keydown',e=>{const editing=e.target.matches('input,textarea,select,[contenteditable]');if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='i'){e.preventDefault();backgroundApproval();return;}if(e.ctrlKey&&e.key.toLowerCase()==='b'){e.preventDefault();remember();if(e.shiftKey)toggleBoard();else toggleSide();render();return;}if(e.ctrlKey&&e.key.toLowerCase()==='j'){e.preventDefault();remember();toggleDock();render();return;}if(!editing&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();navigateVariant(e.key==='ArrowLeft'?-1:1);}if(e.key==='Escape'&&!document.querySelector('dialog[open]')){remember();if(S.view==='dispatch')S.view=S.returnView;else{S.view='thread';S.max=false;}render();}});
addEventListener('resize',()=>{remember();render();});
const scoreRows=[
 ['Thread status is ambient','Pass · header counts + one-action Approval','Pass · same header signal','Pass · groups + header signal'],
 ['Signal, don’t seize','Pass · background Approval updates indicators only','Pass · same behavior','Pass · same behavior; groups can move rows'],
 ['Keeps the working set','Partial · draft/tool state kept; Board hides the Thread','Partial · same; explicit Project-level context','Pass · Thread remains central; no Board switch'],
 ['Each tool has one stable home','Partial · two lists of the same Threads','Pass · recent list for switching, Project Board for overview','Pass · one Thread list, tools in dock'],
 ['Co-used things shown together','Partial · Thread + dock; Board replaces Transcript','Partial · same; Board is a distinct overview task','Partial · Thread + dock; narrow list hides card detail'],
 ['Input announces itself','Pass · Provider prompt / shell labels','Pass · same labels','Pass · same labels'],
 ['Peer switchers / pane toggles','Partial · header Board swaps centre beside dock toggle','Pass · Project navigation; header toggles panes','Pass · sidebar disclosure; header toggles panes'],
 ['900×560 disclosure','Pass · Board fills centre, dock suspended; handles visible','Pass · same; sidebar / dock exclusive','Partial · groups need scrolling; no wide overview']
];
document.querySelector('#comparison').innerHTML=`<div class="flex"><h1 id="comparison-title">Three homes for the Thread Board</h1><span class="sp"></span><button id="close-comparison" aria-label="Close comparison">${icon('close')}</button></div><p>Judgement against “What does UX evidence say about modes versus docked panels?”. These are prototype observations, not user testing. Fixture state is shared across variants.</p><table><thead><tr><th>Principle</th><th>A · Header</th><th>B · Project overview</th><th>C · Sidebar</th></tr></thead><tbody>${scoreRows.map(r=>`<tr>${r.map((cell,i)=>i?`<td class="${cell.startsWith('Pass')?'pass':'partial'}">${cell}</td>`:`<th>${cell}</th>`).join('')}</tr>`).join('')}</tbody></table><h2>Recommendation: B · Project overview</h2><p>The Board belongs to the Project; the recent Thread list stays a fast conversation switcher. A named entry inside the Project makes the scope visible and leaves the header for status and pane toggles. Keep C’s explicit status labels and Board Thread branch metadata. C is the leanest option, but loses the spacious cross-Thread scan.</p><p>At 900×560, opening the Board suspends the dock without clearing its tab or content; returning restores it. In Thread view the sidebar yields to the dock, leaving 416px for the Thread. Maximizing a Surface keeps header status and a Thread rail.</p><p>Try: open the Board; select Slash command catalog and allow its Approval; dispatch a Board Thread from main; type a draft, switch away and back; type in Terminal and trigger Ctrl+Shift+I.</p>`;
document.querySelector('#score').onclick=()=>document.querySelector('#comparison').showModal();document.querySelector('#close-comparison').onclick=()=>document.querySelector('#comparison').close();
render();
</script>
</body>
</html>
